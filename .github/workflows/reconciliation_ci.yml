name: Reconciliation CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install additional CI test libraries if needed
        pip install flake8 pytest

    - name: Lint Code with Flake8
      run: |
        # Stop build if there are syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Generate Synthetic Data
      run: |
        python -m src.generator

    - name: Run Unit Tests
      run: |
        pytest tests/

    - name: Run Determinism Check
      run: |
        # Run determinism checks (dry-run mode if API key is not present)
        python -m scripts.run_determinism_check
