<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top Drive Pinion / Input Shaft (Coming in from 12 o'clock) -->
  <line x1="50" y1="4" x2="50" y2="18" stroke-width="4" stroke="#0ea5e9"/>
  <path d="M 42 18 L 58 18 L 54 26 L 46 26 Z" stroke-width="2.5" stroke="#0ea5e9" fill="rgba(14,165,233,0.2)"/>

  <!-- Face-on Circular Ring Gear (Concentric to Screen) -->
  <circle cx="50" cy="56" r="36" stroke="#334155" stroke-width="3"/>
  <circle cx="50" cy="56" r="30" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="50" cy="56" r="24" stroke="#334155" stroke-width="2"/>

  <!-- Carrier Housing Cage (Center Window) -->
  <rect x="36" y="42" width="28" height="28" rx="6" stroke="currentColor" stroke-width="2.5" fill="rgba(255,255,255,0.04)"/>

  <!-- 4 Spider Bevel Pinions (Cross Arrangement) -->
  <polygon points="50,37 46,43 54,43" stroke="currentColor" stroke-width="2" fill="rgba(14,165,233,0.15)"/>
  <polygon points="50,75 46,69 54,69" stroke="currentColor" stroke-width="2" fill="rgba(14,165,233,0.15)"/>
  <polygon points="31,56 37,52 37,60" stroke="currentColor" stroke-width="2" fill="rgba(14,165,233,0.15)"/>
  <polygon points="69,56 63,52 63,60" stroke="currentColor" stroke-width="2" fill="rgba(14,165,233,0.15)"/>

  <!-- Central Axle Bore (Perpendicular to Screen — Axis pointing at Viewer) -->
  <circle cx="50" cy="56" r="7" stroke="#0ea5e9" stroke-width="2.5" fill="#0f172a"/>
  
  <!-- Welded Locking Cross / Spline Bead in Center -->
  <line x1="50" y1="48" x2="50" y2="64" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="42" y1="56" x2="58" y2="56" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="50" cy="56" r="2.5" fill="#ffffff" stroke="none"/>
</svg>
