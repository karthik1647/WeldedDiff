<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Torsen Carrier Cage Frame -->
  <circle cx="50" cy="50" r="44" stroke="#334155" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="40" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 3 Symmetrical Helical Worm Pinions (120-degree radial offset) -->
  
  <!-- 1. Top Helical Gear (0 deg) -->
  <g transform="translate(50, 20)">
    <rect x="-16" y="-7" width="32" height="14" rx="4" stroke="currentColor" stroke-width="2.4" fill="rgba(14,165,233,0.12)"/>
    <!-- Helical Slanted Teeth -->
    <line x1="-10" y1="5" x2="-4" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-3" y1="5" x2="3" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="4" y1="5" x2="10" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
  </g>

  <!-- 2. Bottom-Right Helical Gear (120 deg) -->
  <g transform="translate(68, 62) rotate(120)">
    <rect x="-16" y="-7" width="32" height="14" rx="4" stroke="currentColor" stroke-width="2.4" fill="rgba(14,165,233,0.12)"/>
    <!-- Helical Slanted Teeth -->
    <line x1="-10" y1="5" x2="-4" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-3" y1="5" x2="3" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="4" y1="5" x2="10" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
  </g>

  <!-- 3. Bottom-Left Helical Gear (240 deg) -->
  <g transform="translate(32, 62) rotate(240)">
    <rect x="-16" y="-7" width="32" height="14" rx="4" stroke="currentColor" stroke-width="2.4" fill="rgba(14,165,233,0.12)"/>
    <!-- Helical Slanted Teeth -->
    <line x1="-10" y1="5" x2="-4" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-3" y1="5" x2="3" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="4" y1="5" x2="10" y2="-5" stroke="#0ea5e9" stroke-width="2"/>
  </g>

  <!-- Central Torsen Sun Gear & Axle Hub (Facing straight forward) -->
  <circle cx="50" cy="50" r="16" stroke="currentColor" stroke-width="2.8" fill="#0f172a"/>
  <circle cx="50" cy="50" r="8" stroke="#38bdf8" stroke-width="2.2" fill="#38bdf8"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff" stroke="none"/>
</svg>
